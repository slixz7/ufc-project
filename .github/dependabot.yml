# Weekly check for newer versions of the GitHub Actions the workflows use (checkout, setup-python, upload-artifact, download-artifact). A new version arrives as a pull request
# and the Tests workflow runs on it, so nothing changes until a green check says it is safe. The two artifact actions are used together, so they are grouped into ONE pull request.
# They need not be on the same major version (from v4 on they share one artifact service; only v3 or older cannot exchange artifacts with it, and a test refuses that). The Python packages are not handled here:
# they are locked in constraints-ci.txt and refreshed monthly by .github/workflows/refresh-lock.yml, after the whole suite has passed on the new versions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
