name: Auto update

# Runs the hands-off upkeep (pipeline/auto_update.py): announced cards, betting lines, picks, results.
#   Manual run : Actions tab > "Auto update" > Run workflow  (starts as a dry run that writes nothing)
#   Daily run  : only happens once you set the repository VARIABLE  AUTO_ENABLED = true
# Secrets (Settings > Secrets and variables > Actions): DATABASE_URL (owner string), ODDS_API_KEY, KAGGLE_API_TOKEN,
#   DISCORD_WEBHOOK_URL (optional: posts new picks and results to a Discord channel)
# After each real run the job commits picks_log/locked_picks.csv (a public time-stamped record of every locked pick) and, on Mondays,
# README.md when its generated numbers changed. It never commits anything else.
on:
  schedule:
    - cron: "17 14 * * *"          # every day at 14:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Look and report, but write nothing"
        type: boolean
        default: true

permissions:
  contents: write            # only so the job can commit picks_log/ and README.md; it never touches any other file

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r pipeline/requirements.txt

      - name: Offline tests (a broken page reader stops the job before it writes anything)
        run: python -m pytest -q tests

      - name: Run the upkeep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python pipeline/auto_update.py all $DRY

      - name: Publish the pick log and any refreshed README numbers
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run != true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d picks_log ]; then git add picks_log; fi
          if git diff --cached --quiet; then
            echo "No new picks to log."
            exit 0
          fi
          git commit -m "Update the pick log and README numbers"
          git pull --rebase origin main
          git push origin HEAD:main
