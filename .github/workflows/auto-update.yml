name: Auto update

# Runs the hands-off upkeep (pipeline/auto_update.py): announced cards, betting lines, picks, results.
#   Manual run : Actions tab > "Auto update" > Run workflow  (starts as a dry run that writes nothing)
#   Daily run  : only happens once you set the repository VARIABLE  AUTO_ENABLED = true
# Secrets (Settings > Secrets and variables > Actions): DATABASE_URL (owner string), ODDS_API_KEY, KAGGLE_API_TOKEN
on:
  schedule:
    - cron: "17 14 * * *"          # every day at 14:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Look and report, but write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r pipeline/requirements.txt

      - name: Offline tests (a broken page reader stops the job before it writes anything)
        run: python -m pytest -q tests

      - name: Run the upkeep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python pipeline/auto_update.py all $DRY
