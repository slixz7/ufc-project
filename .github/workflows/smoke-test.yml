name: Live site check

# Opens every page of the LIVE site in a real browser and checks that it works: the page opens (a sleeping app is woken first), shows the text it always shows, shows none of the signs of
# a broken page, and the header's "Results through" date is not more than 21 days old. It exists because everything else alerts when a job FAILS, and nothing noticed when the site
# itself broke (for example a database permission change that left one page unable to load). It only READS the site: no sign-in, no secrets.
#
# It runs every day after the daily job (14:17 UTC), on demand, and after every push to main once the Tests workflow has passed (it waits four minutes first, so the host has time to
# redeploy). A failure is retried once inside the tool before it counts, then posts to the private alert channel, with a screenshot of the failing page saved as a run artifact.
#
# Optional: set the repository variable SITE_URL if the site moves; it defaults to the live address.
on:
  schedule:
    - cron: "20 15 * * *"          # every day at 15:20 UTC, an hour after the daily job
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions: {}                    # nothing by default: each job asks for exactly what it needs

concurrency:
  group: live-site-check
  cancel-in-progress: false

jobs:
  check:
    name: Open every page of the live site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # PINNED, not ubuntu-latest: that label moved to Ubuntu 26.04, which the pinned Playwright (tools/smoke-requirements.txt) does not support ("Playwright does not support
    # chromium on ubuntu26.04-x64"), and a browser that cannot install is a monitor that cannot run. Playwright 1.56.0 names Ubuntu up to 24.04, and this workflow passed on 24.04 before
    # the label moved. To move to a newer Ubuntu, change the runner and the Playwright version TOGETHER (a release that names the new Ubuntu), then run this workflow by hand.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      check_outcome: ${{ steps.check.outcome }}          # "failure" when the site check ran and failed; "skipped" when the browser could not even be set up
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Give the host time to redeploy (only after a push)
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 240

      - name: Install the browser driver (exact version, from the pinned file)
        run: |
          pip install -r tools/smoke-requirements.txt
          python -m playwright install --with-deps chromium

      - name: Open every page
        id: check
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ufc-predictor.streamlit.app/' }}
        run: python tools/smoke_test.py "$SITE_URL" --out smoke_out

      - name: Keep the screenshots of a failing page
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: smoke_out
          retention-days: 7
          if-no-files-found: ignore

  alert:
    name: Tell the alert channel if the live site has a problem
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Tell the alert channel that the check failed
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}          # its own private channel, never the one the friends read; if it is not set, nothing is sent
          CHECK_OUTCOME: ${{ needs.check.outputs.check_outcome }}
        run: |
          name="Live site check"
          if [ "$CHECK_OUTCOME" != "failure" ]; then
            name="Live site check (browser setup, not the site)"
          fi
          python3 pipeline/notify_failure.py "$name"
